name = "categorical_influence_diagrams_proofs"
defaultTargets = ["CategoricalInfluenceDiagramsProofs"]
# Share one dependency checkout across the ecosystem's proofs/ projects. See ADR 0005.
packagesDir = "../../.lake-packages"

# mdgen turns the `/-! ... -/` module docs into Markdown (`make mdgen`). Pinned to the tag
# matching the toolchain, and listed before mathlib: Lake lets the *last* `require` win, so
# Mathlib's pins take precedence.
[[require]]
name = "mdgen"
git = "https://github.com/Seasawher/mdgen"
rev = "v4.30.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

[[lean_lib]]
name = "CategoricalInfluenceDiagramsProofs"

# The typed open-network syntax and its FinStoch interpretation (ADR 0010).
[[require]]
name = "categorical_bayesian_networks_proofs"
path = "../../CategoricalBayesianNetworks.jl/proofs"

# The finite influence-diagram model: instantiation, expected utility, optimisation.
[[require]]
name = "influence_diagrams_proofs"
path = "../../InfluenceDiagrams.jl/proofs"
