name = "categorical_influence_diagrams_proofs"
defaultTargets = ["CategoricalInfluenceDiagramsProofs", "check_certificate", "check_composition"]
# Share one dependency checkout across the ecosystem's proofs/ projects. See ADR 0005.
packagesDir = "../../.lake-packages"

# mdgen turns the `/-! ... -/` module docs into Markdown (`make mdgen`). Pinned to the tag
# matching the toolchain, and listed before mathlib: Lake lets the *last* `require` win, so
# Mathlib's pins take precedence.
[[require]]
name = "mdgen"
git = "https://github.com/Seasawher/mdgen"
rev = "v4.30.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

[[lean_lib]]
name = "CategoricalInfluenceDiagramsProofs"

# The typed open-network syntax and its FinStoch interpretation (ADR 0010).
[[require]]
name = "categorical_bayesian_networks_proofs"
path = "../../CategoricalBayesianNetworks.jl/proofs"

# The finite influence-diagram model: instantiation, expected utility, optimisation.
[[require]]
name = "influence_diagrams_proofs"
path = "../../InfluenceDiagrams.jl/proofs"

# `lake exe check_certificate PATH [--tol τ]`: decode and check an
# `OpenInfluence.RewardCertificate/v1` file (ADR 0019; `Certificate/Check.lean`).
[[lean_exe]]
name = "check_certificate"
root = "CertificateMain"

# `lake exe check_composition PATH [--tol τ]`: decode and check an
# `OpenInfluence.CompositionCertificate/v1` file (ADR 0023; `Certificate/Composition.lean`).
[[lean_exe]]
name = "check_composition"
root = "CompositionMain"

# SA-Pass shadow modules (conformance/sapass), built by the runner, not by default.
[[lean_lib]]
name = "Shadows"
srcDir = "."
globs = ["CategoricalInfluenceDiagramsProofs.Shadows.*"]
